<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header class="bg-dark text-white py-3">
        <div class="container">
            <h1 class="h3">Мой магазин</h1>
            <nav>
                <a href="/" class="text-white me-4">Главная</a>
                <a href="/contacts" class="text-white me-4">Контакты</a>
                <a href="/read-contacts" class="text-white">Чтение файла</a>
            </nav>
        </div>
    </header>

    <main class="container my-5">
        <h2>Наши контакты</h2>
        <p>ご連絡できるよう、お客様の情報をご記入ください。当ウェブサイトをご覧いただきありがとうございます！</p>

        <!-- Форма для POST-запроса (Задание 3) -->
        <h3 class="mt-5">Обратная связь</h3>
        <form action="/contacts" method="post" class="mt-3">
            <div class="mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Сообщение</label>
                <textarea class="form-control" id="message" name="message" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
    </main>

    <footer class="bg-light text-center py-3 mt-5">
        <p class="mb-0">© 2026 Мой магазин. Все права защищены.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
